# Deploy to Cloudflare Pages

Triggers on push to main. Cloudflare Pages will build and serve the static files.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pollinations-app
          directory: .
          # No build step — this is a pure-static app, push existing files directly
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
